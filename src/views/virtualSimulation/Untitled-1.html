<template>
    <div class="wrap">
        <div class="banner"></div>
        <div class="min-container">
            <div class="tab-bar">
                <div
                    class="tab-item"
                    :class="{ active: item.title == state.educationType }"
                    v-for="item in state.tabList"
                    :key="item.icon"
                    @click="changeType(item.title)"
                >
                    <div class="mask-layer">
                        <i :class="['iconfont', item.icon]"></i>
                        <div class="tag">{{ item.title }}</div>
                        <div class="line"></div>
                    </div>
                </div>
            </div>
            <div class="content-box">
                <div class="course-box">
                    <div class="course-item" v-for="item in state.courseList" @click="toNext(item)">
                        <div class="course-img-box">
                            <img class="course-img" :src="item.imageUrl" alt="" />
                        </div>
                        <div class="course-name">{{ item.name }}</div>
                    </div>
                </div>
                <div class="page-bottom">
                    <el-config-provider :locale="zhCn">
                        <el-pagination
                            v-model:current-page="state.page.pageNum"
                            v-model:page-size="state.page.pageSize"
                            background
                            layout="prev, pager, next, jumper"
                            :total="state.page.total"
                            @size-change="getList"
                            @current-change="getList"
                        />
                    </el-config-provider>
                </div>
            </div>
        </div>
    </div>
</template>

<script setup>
import { ref, computed, reactive, onMounted, getCurrentInstance } from 'vue';
import zhCn from 'element-plus/dist/locale/zh-cn.mjs';
import { HomeApi } from "@/assets/api/home"
import { useRoute } from "vue-router"
const { proxy } = getCurrentInstance();
const route = useRoute()
const homeApi = new HomeApi()

const state = reactive({
	tabList: [
		{
			icon: 'icon-jichupeizhi',
			title: '专业基础课',
		},
		{
			icon: 'icon-hexin',
			title: '专业核心课',
		},
		{
			icon: 'icon-tuozhan',
			title: '专业拓展课',
		},
		{
			icon: 'icon-shixun',
			title: '实习实训课',
		},
	],
	page: {
		pageNum: 1,
		pageSize: 8,
		total: 0
	},
	educationType: '专业基础课',
	lastTime: 0,
	courseList: []
})

const getList = () => {
	homeApi.getCourseList({
		...state.page,
		courseType: '学历课程',
		educationType: state.educationType
	}).then((res) => {
		state.courseList = res.rows
		state.page.total = res.total
	})
}

const changeType = (e) => {
	state.educationType = e
	getList()
}

const toNext = (item) => {
	window.open(`https://zyk.icve.com.cn/courseDetailed?id=${item.id}`, '_blank');
};

onMounted(() => {
	proxy.bus.on('courseReload', (index) => {
		state.educationType = state.tabList[index].title
		getList();
	});
	if (route.query.index) {
        let index = Number(route.query.index);
        state.educationType = state.tabList[index].title;
    } else {
        state.educationType = state.tabList[0].title;
    }

	getList();
})
</script>
